<!--realizar una app web donde el usuario llene un form, ingrese 3 valores
resolucion de ecuaciones de 2do grado
ingrese a
ingrese b
ingrese c
calcular
mostrar respuesta*-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="scripts j/estilos.css">
    <title>Intro a JS</title>
</head>
<body>
    <!--Cabecera-->
    <div>
        <header>
            <h1>Aplicacion que calcula numeros primos, mayor, menor o igual que</h1>
            <h2>A x<sup>2</sup> + Bx + C</h2>
        </header>
        <form action="" id="formRCalculo">
            <div>
                <label for="">Ingrese A</label>
                <input type="number" id="a" required>
            </div>
            
            <div>
                <label for="">Ingrese B</label>
                <input type="number" id="b" required>
            </div>

            <div>
                <label for="">Ingrese C</label>
                <input type="number" id="c" required>
            </div>

            <div>
                <input type="submit" value="Mostrar resultado">
            </div>
            <div>
                <input type="reset" value="Limpiar campos">
            </div>
        </form>
        <div>
            <h3>Resultado</h3>
            <div id="resultado"></div>
        </div>
    </div>
<script src="logica.js"></script>
</body>
</html>
